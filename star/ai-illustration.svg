<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none">
  <defs>
    <!-- 发光滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 渐变 -->
    <linearGradient id="grad-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad-line1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="grad-line2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- === 轨道环 === -->
  <ellipse cx="240" cy="210" rx="210" ry="60" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.35" transform="rotate(-15 240 210)"/>
  <ellipse cx="240" cy="210" rx="210" ry="60" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.25" transform="rotate(15 240 210)"/>
  <circle cx="240" cy="210" r="185" stroke="#e5e7eb" stroke-width="0.6" stroke-dasharray="3 8" opacity="0.3"/>
  <circle cx="240" cy="210" r="140" stroke="#e5e7eb" stroke-width="0.6" opacity="0.2"/>

  <!-- === 连线网络 === -->
  <!-- 中央到左上 -->
  <line x1="218" y1="188" x2="65" y2="55" stroke="url(#grad-line1)" stroke-width="1.2"/>
  <circle cx="65" cy="55" r="22" stroke="#3b82f6" stroke-width="2" fill="white"/>
  <circle cx="65" cy="55" r="22" stroke="#3b82f6" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="65" y="50" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1e40af">{&#160;}</text>
  <text x="65" y="63" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">JSON</text>

  <!-- 中央到右上 -->
  <line x1="262" y1="188" x2="415" y2="55" stroke="url(#grad-line2)" stroke-width="1.2"/>
  <circle cx="415" cy="55" r="22" stroke="#8b5cf6" stroke-width="2" fill="white"/>
  <circle cx="415" cy="55" r="22" stroke="#8b5cf6" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="415" y="50" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#6d28d9">&lt;/&gt;</text>
  <text x="415" y="63" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">CODE</text>

  <!-- 中央到左中 -->
  <line x1="210" y1="218" x2="30" y2="210" stroke="url(#grad-line1)" stroke-width="1.2"/>
  <circle cx="30" cy="210" r="22" stroke="#06b6d4" stroke-width="2" fill="white"/>
  <circle cx="30" cy="210" r="22" stroke="#06b6d4" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="30" y="205" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">fn()</text>
  <text x="30" y="219" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">WORKER</text>

  <!-- 中央到右中 -->
  <line x1="270" y1="218" x2="450" y2="210" stroke="url(#grad-line2)" stroke-width="1.2"/>
  <circle cx="450" cy="210" r="22" stroke="#f59e0b" stroke-width="2" fill="white"/>
  <circle cx="450" cy="210" r="22" stroke="#f59e0b" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="450" y="205" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#b45309">SSE</text>
  <text x="450" y="219" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">STREAM</text>

  <!-- 中央到左下 -->
  <line x1="218" y1="242" x2="65" y2="365" stroke="url(#grad-line1)" stroke-width="1.2"/>
  <circle cx="65" cy="365" r="22" stroke="#10b981" stroke-width="2" fill="white"/>
  <circle cx="65" cy="365" r="22" stroke="#10b981" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="65" y="360" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#047857">MD</text>
  <text x="65" y="374" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">RENDER</text>

  <!-- 中央到右下 -->
  <line x1="262" y1="242" x2="415" y2="365" stroke="url(#grad-line2)" stroke-width="1.2"/>
  <circle cx="415" cy="365" r="22" stroke="#ec4899" stroke-width="2" fill="white"/>
  <circle cx="415" cy="365" r="22" stroke="#ec4899" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
  <text x="415" y="360" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#be185d">🔐</text>
  <text x="415" y="374" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">RSA</text>

  <!-- === 中央 AI 核心 === -->
  <rect x="195" y="175" width="90" height="70" rx="14" stroke="url(#grad-core)" stroke-width="3" fill="white"/>
  <rect x="195" y="175" width="90" height="70" rx="14" stroke="url(#grad-core)" stroke-width="6" opacity="0.08" filter="url(#glow-strong)"/>
  <text x="240" y="200" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800" fill="url(#grad-core)">AI</text>
  <text x="240" y="220" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">CORE</text>

  <!-- === 脉冲波纹 === -->
  <rect x="190" y="170" width="100" height="80" rx="16" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <rect x="185" y="165" width="110" height="90" rx="18" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>

  <!-- === 浮动节点 === -->
  <circle cx="130" cy="130" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="350" cy="120" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="110" cy="290" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="370" cy="300" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="240" cy="105" r="3" fill="#94a3b8" opacity="0.3"/>
  <circle cx="240" cy="320" r="3" fill="#94a3b8" opacity="0.3"/>
  <circle cx="170" cy="155" r="2.5" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="310" cy="155" r="2.5" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="170" cy="265" r="2.5" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="310" cy="265" r="2.5" fill="#cbd5e1" opacity="0.4"/>

  <!-- === 顶部环境标注 === -->
  <text x="240" y="28" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="2">DEEPSEEK-V4 · SPARK PRO</text>
  <line x1="120" y1="38" x2="360" y2="38" stroke="#e5e7eb" stroke-width="0.8"/>

  <!-- === 底部环境标注 === -->
  <line x1="120" y1="395" x2="360" y2="395" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="240" y="412" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="2">MARKDOWN · REASONING · WIDGET</text>
</svg>
